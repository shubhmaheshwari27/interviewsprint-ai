name: CI

on:
  push:
    branches: [main, "upgrade/**"]
  pull_request:

jobs:
  web:
    name: Web app (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npx next build
        env:
          AUTH_SECRET: ci-only-secret-not-used-in-production-0000

  analytics-service:
    name: Analytics service (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Test and package
        run: mvn -B verify
